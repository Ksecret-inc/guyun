.reset{margin-left:auto;border:0;background:none;color:var(--s1);font:inherit;font-size:13px;cursor:pointer;padding:5px 2px;white-space:nowrap}
.reset[hidden]{display:none}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:14px 16px}

.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.4px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px;min-width:0}
.card.wide{grid-column:1 / -1}
.chead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:6px}

.hint{font-size:12px;color:var(--ink3)}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px}

    else if(ch === ','){ row.push(cur); cur = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i+1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if(cur !== '' || row.length){ row.push(cur); out.push(row); }
  return out.filter(r => r.some(c => c.trim() !== ''));
}
function fromTable(t){
  const head = t[0].map(h => h.trim());
  const col = name => head.findIndex(h => h.startsWith(name));
  const ix = { m:col('월'), p:col('제품'), c:col('채널'), q:col('판매수량'), pr:col('정가'), d:col('할인율'), r:col('매출') };
  if(Object.values(ix).some(i => i < 0)) throw new Error('열 이름이 예상과 다릅니다: ' + head.join(', '));
  const num = s => Number(String(s).replace(/[,\s원%]/g,'')) || 0;
  const months = [], products = [], channels = [], rows = [];
  const idx = (arr, v) => { let i = arr.indexOf(v); if(i < 0){ arr.push(v); i = arr.length-1; } return i; };
  for(const r of t.slice(1)){
    const m = (r[ix.m]||'').trim(); if(!/^\d{4}-\d{2}$/.test(m)) continue;
    rows.push([idx(months,m), idx(products,(r[ix.p]||'').trim()), idx(channels,(r[ix.c]||'').trim()),
               num(r[ix.q]), num(r[ix.pr]), num(r[ix.d]), num(r[ix.r])]);
  }
  if(!rows.length) throw new Error('읽은 행이 없습니다');
  // 월은 시간순으로 정렬
  const order = months.map((m,i)=>[m,i]).sort((a,b)=>a[0]<b[0]?-1:1);
  const remap = new Map(order.map(([,old],neu)=>[old,neu]));
  rows.forEach(r => r[0] = remap.get(r[0]));
  return { months: order.map(o=>o[0]), products, channels, rows };
}
async function load(){
  const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&gid=' + SHEET_GID;
  try{
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 6000);
    const res = await fetch(url, { signal: ctl.signal }); clearTimeout(t);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    D = fromTable(parseCSV(await res.text()));
    setSource('live', '구글 시트 실시간 · ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) + ' 읽음');
  }catch(e){
    D = SNAP;
    setSource('snap', '시트를 읽지 못해 11/20 사본 표시 중');
  }
  buildChips(); render();
}
function setSource(kind, text){
  document.getElementById('src').innerHTML = '<span class="dot ' + kind + '"></span>' + esc(text) +
    ' · <a href="https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/edit#gid=' + SHEET_GID + '" target="_blank" rel="noopener">원본 시트</a>';
}

/* ---------- 필터 ---------- */
const DIM_INDEX = { month:0, product:1, channel:2 };
function names(dim){ return dim === 'month' ? D.months : dim === 'product' ? D.products : D.channels; }
function rowsExcept(skip){
  return D.rows.filter(r => ['month','product','channel'].every(dim =>
    dim === skip || sel[dim].size === 0 || sel[dim].has(r[DIM_INDEX[dim]])));
}
function toggle(dim, i){
  if(sel[dim].has(i)) sel[dim].delete(i); else sel[dim].add(i);
  if(sel[dim].size === names(dim).length) sel[dim].clear();
  render();
}
function buildChips(){
  for(const dim of ['month','product','channel']){
    const box = document.getElementById('f-' + dim); box.innerHTML = '';
    const all = document.createElement('button');
    all.className = 'chip all'; all.textContent = '전체'; all.dataset.all = '1';
    all.onclick = () => { sel[dim].clear(); render(); };
    box.appendChild(all);
    names(dim).forEach((n, i) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.dataset.i = i;
      b.textContent = dim === 'month' ? monthLabel(n) : n;
      b.title = n;
      b.onclick = () => toggle(dim, i);
      box.appendChild(b);
    });
  }
}
function syncChips(){
  for(const dim of ['month','product','channel']){
    document.querySelectorAll('#f-' + dim + ' .chip').forEach(b => {
      const on = b.dataset.all ? sel[dim].size === 0 : sel[dim].has(+b.dataset.i);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  document.getElementById('reset').hidden = !(sel.month.size || sel.product.size || sel.channel.size);
}
document.getElementById('reset').onclick = () => { sel.month.clear(); sel.product.clear(); sel.channel.clear(); render(); };
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  stackBy = b.dataset.stack;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  render();
});

/* ---------- 툴팁 ---------- */
const tip = document.getElementById('tip');
function showTip(html, ev){
  tip.innerHTML = html; tip.classList.add('on');
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if(x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if(y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = Math.max(8,x) + 'px'; tip.style.top = Math.max(8,y) + 'px';
}
function showTipAt(html, el){
  const b = el.getBoundingClientRect();
  showTip(html, { clientX: b.left + b.width/2, clientY: b.top + b.height/2 });
}
function hideTip(){ tip.classList.remove('on'); }

/* ---------- SVG 도우미 ---------- */
function el(tag, attrs, parent){
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
// 한쪽 끝만 둥근 막대 (side: 'top' | 'right')
function barPath(x, y, w, h, rad, side){
  if(w <= 0 || h <= 0) return '';
  if(side === 'top'){
    const r = Math.min(rad, w/2, h);
    return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;
  }
  if(side === 'right'){
    const r = Math.min(rad, h/2, w);
    return `M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z`;
  }
  return `M${x},${y}h${w}v${h}h${-w}Z`;
}
function niceMax(v){
  if(v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if(m*p >= v) return m*p;
  return 10*p;
}
const SERIES = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'];

/* ---------- 월별 쌓은 막대 ---------- */
function drawMonthly(){
  const host = document.getElementById('c-month'); host.innerHTML = '';
  const rows = rowsExcept('month');
  const keys = stackBy === 'channel' ? D.channels : D.products;
  const ki = stackBy === 'channel' ? 2 : 1;
  const keySel = stackBy === 'channel' ? sel.channel : sel.product;
  const shown = keys.map((k,i)=>i).filter(i => keySel.size === 0 || keySel.has(i));

  document.getElementById('legend').innerHTML = shown.map(i =>
    `<span><i class="sw" style="background:${SERIES[i % SERIES.length]}"></i>${esc(keys[i])}</span>`).join('');

  const M = D.months.length;
  const val = D.months.map(() => keys.map(() => 0));
  rows.forEach(r => { val[r[0]][r[ki]] += r[6]; });
  const totals = val.map(v => v.reduce((a,b)=>a+b,0));
  const max = niceMax(Math.max(...totals));

  const W = Math.max(host.clientWidth, 300), H = 280;
  const pad = { l:48, r:8, t:22, b:26 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const svg = el('svg', { viewBox:`0 0 ${W} ${H}`, height:H, role:'img', 'aria-label':'월별 매출 쌓은 막대 차트' }, host);
  const y = v => pad.t + ih - v/max*ih;

  for(let k=0;k<=4;k++){
    const v = max*k/4, yy = y(v);
    el('line', { x1:pad.l, x2:W-pad.r, y1:yy, y2:yy, stroke: k===0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width':1 }, svg);
    el('text', { x:pad.l-8, y:yy+4, 'text-anchor':'end', class:'tick' }, svg).textContent = axisFmt(v);
  }

  const band = iw / M, bw = Math.min(46, band*0.62);
  const anySel = sel.month.size > 0;
  const peak = totals.indexOf(Math.max(...totals));

  D.months.forEach((m, mi) => {
    const cx = pad.l + band*mi + band/2, x0 = cx - bw/2;
    const g = el('g', { class:'col-hit', tabindex:0, role:'button',
      'aria-label': `${monthLabel(m)} ${short(totals[mi])}원${sel.month.has(mi)?' (선택됨)':''}`,
      'aria-pressed': sel.month.has(mi) ? 'true':'false' }, svg);
    el('rect', { class:'bg', x:pad.l+band*mi+2, y:pad.t-14, width:band-4, height:ih+14, rx:6 }, g);
    const faded = anySel && !sel.month.has(mi);
    let acc = 0;
    const segs = shown.filter(i => val[mi][i] > 0);
    segs.forEach((i, si) => {
      const v = val[mi][i]; const top = y(acc + v), bot = y(acc);
      const isTop = si === segs.length-1;
      const h = Math.max(0, bot - top - (si > 0 ? 2 : 0)); // 2px 표면 간격
      el('path', { d: barPath(x0, top, bw, h, 4, isTop ? 'top' : 'none'),
        fill: faded ? 'var(--dim)' : SERIES[i % SERIES.length] }, g);
      acc += v;
    });
    el('text', { x:cx, y:H-8, 'text-anchor':'middle', class: faded ? 'tick' : '' }, g).textContent = monthLabel(m);
    // 값 라벨은 선택된 달 또는 최고 월에만
    if(totals[mi] > 0 && (sel.month.has(mi) || (!anySel && mi === peak)))
      el('text', { x:cx, y:y(totals[mi])-6, 'text-anchor':'middle', style:'fill:var(--ink);font-weight:600' }, g).textContent = short(totals[mi]);

    const html = () => `<b>${esc(m)}</b>` + shown.slice().reverse().map(i =>
        `<div class="r"><span><i class="sw" style="background:${SERIES[i % SERIES.length]}"></i>${esc(keys[i])}</span><span>${short(val[mi][i])}</span></div>`).join('') +
      `<div class="r tot"><span>합계</span><span>${won(totals[mi])}</span></div>`;
    g.addEventListener('mousemove', ev => showTip(html(), ev));
    g.addEventListener('mouseleave', hideTip);
    g.addEventListener('focus', () => showTipAt(html(), g));
    g.addEventListener('blur', hideTip);
    g.addEventListener('click', () => { hideTip(); toggle('month', mi); });
    g.addEventListener('keydown', ev => { if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); toggle('month', mi); } });
  });
}

/* ---------- 가로 막대 (제품 / 채널) ---------- */
function drawBars(dim){
  const host = document.getElementById('c-' + dim); host.innerHTML = '';
  const rows = rowsExcept(dim);
  const list = names(dim), di = DIM_INDEX[dim];
  const rev = list.map(() => 0), qty = list.map(() => 0);
  rows.forEach(r => { rev[r[di]] += r[6]; qty[r[di]] += r[3]; });
  const total = rev.reduce((a,b)=>a+b,0);
  const order = list.map((_,i)=>i).sort((a,b)=>rev[b]-rev[a]);
  const max = Math.max(...rev, 1);

  const W = Math.max(host.clientWidth, 280), rowH = 40;
  const labelW = Math.min(150, W*0.38), valW = 92;
  const H = rowH * list.length + 4;
  const svg = el('svg', { viewBox:`0 0 ${W} ${H}`, height:H, role:'img', 'aria-label': (dim==='product'?'제품':'채널') + '별 매출 가로 막대 차트' }, host);
  const bx = labelW, bwMax = W - labelW - valW;
  const anySel = sel[dim].size > 0;

  order.forEach((i, k) => {
    const y0 = k*rowH;
    const on = !anySel || sel[dim].has(i);
    const g = el('g', { class:'bar-hit' + (on ? '' : ' dimmed'), tabindex:0, role:'button',
      'aria-label': `${list[i]} ${short(rev[i])}원${sel[dim].has(i)?' (선택됨)':''}`, 'aria-pressed': sel[dim].has(i)?'true':'false' }, svg);
    el('rect', { class:'bg', x:0, y:y0+2, width:W, height:rowH-4, rx:6 }, g);
    const lbl = el('text', { x:8, y:y0+rowH/2+4, class:'bar-label' }, g);
    lbl.textContent = list[i].length > 13 && W < 420 ? list[i].slice(0,12) + '…' : list[i];
    const w = rev[i] / max * bwMax;
    el('path', { d: barPath(bx, y0+11, Math.max(w, rev[i] > 0 ? 2 : 0), rowH-22, 4, 'right'),
      fill: on ? 'var(--s1)' : 'var(--dim)' }, g);
    const pct = total ? Math.round(rev[i]/total*1000)/10 : 0;
    el('text', { x:W-6, y:y0+rowH/2+4, 'text-anchor':'end', class:'bar-val' }, g).textContent = short(rev[i]) + ' · ' + pct + '%';

    const html = () => `<b>${esc(list[i])}</b>` +
      `<div class="r"><span>매출</span><span>${won(rev[i])}</span></div>` +
      `<div class="r"><span>비중</span><span>${pct}%</span></div>` +
      `<div class="r"><span>판매수량</span><span>${nf.format(qty[i])}개</span></div>`;
    g.addEventListener('mousemove', ev => showTip(html(), ev));
    g.addEventListener('mouseleave', hideTip);
    g.addEventListener('focus', () => showTipAt(html(), g));
    g.addEventListener('blur', hideTip);
    g.addEventListener('click', () => { hideTip(); toggle(dim, i); });
    g.addEventListener('keydown', ev => { if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); toggle(dim, i); } });
  });
}

/* ---------- KPI ---------- */
function drawKpis(){
  const rows = rowsExcept(null);
  const rev = rows.reduce((a,r)=>a+r[6],0);
  const qty = rows.reduce((a,r)=>a+r[3],0);
  const list = rows.reduce((a,r)=>a+r[3]*r[4],0);
  const months = new Set(rows.map(r=>r[0]));
  const ms = [...months].sort((a,b)=>a-b);
  // 마지막 달 vs 그 전 달 (같은 제품·채널 조건)
  let delta = '';
  const last = ms[ms.length-1];
  if(last > 0){
    const base = D.rows.filter(r => (sel.product.size===0||sel.product.has(r[1])) && (sel.channel.size===0||sel.channel.has(r[2])));
    const a = base.filter(r=>r[0]===last).reduce((s,r)=>s+r[6],0);
    const b = base.filter(r=>r[0]===last-1).reduce((s,r)=>s+r[6],0);
    if(b > 0){
      const p = (a/b-1)*100;
      delta = `${monthLabel(D.months[last])} 전월 대비 ${p >= 0 ? '▲' : '▼'} ${Math.abs(p).toFixed(1)}%`;
    }
  }
  const range = ms.length ? (ms.length === 1 ? D.months[ms[0]] : `${monthLabel(D.months[ms[0]])}–${monthLabel(D.months[last])} 중 ${ms.length}개월`) : '해당 없음';
  const k = [
    ['총매출', short(rev) + '원', range],
    ['월평균 매출', ms.length ? short(rev/ms.length) + '원' : '–', delta || '비교할 전월 없음'],
    ['판매수량', nf.format(qty) + '개', '개당 평균 ' + (qty ? nf.format(Math.round(rev/qty)) : 0) + '원'],
    ['평균 할인율', list ? ((1 - rev/list)*100).toFixed(1) + '%' : '–', '정가 기준 ' + short(list) + '원'],
  ];
  document.getElementById('kpis').innerHTML = k.map(([a,b,c]) =>
    `<div class="kpi"><div class="k">${a}</div><div class="v">${b}</div><div class="d">${esc(c)}</div></div>`).join('');
}

/* ---------- 표 ---------- */
function drawTable(){
  const rows = rowsExcept(null);
  const P = D.products.map((_,i)=>i).filter(i => sel.product.size===0 || sel.product.has(i));
  const C = D.channels.map((_,i)=>i).filter(i => sel.channel.size===0 || sel.channel.has(i));
  const m = {}; rows.forEach(r => { const k = r[1]+'|'+r[2]; m[k] = (m[k]||0) + r[6]; });
  const cell = v => v ? `<td>${nf.format(v)}</td>` : `<td class="zero">–</td>`;
  let h = '<table><thead><tr><th>제품</th>' + C.map(c=>`<th>${esc(D.channels[c])}</th>`).join('') + '<th>합계</th></tr></thead><tbody>';
  const colTot = C.map(()=>0); let all = 0;
  P.forEach(p => {
    let t = 0;
    h += `<tr><td>${esc(D.products[p])}</td>` + C.map((c,ci) => { const v = m[p+'|'+c]||0; t += v; colTot[ci] += v; return cell(v); }).join('') + `<td><b>${nf.format(t)}</b></td></tr>`;
    all += t;
  });
  h += '</tbody><tfoot><tr><td>합계</td>' + colTot.map(v=>`<td>${nf.format(v)}</td>`).join('') + `<td>${nf.format(all)}</td></tr></tfoot></table>`;
  document.getElementById('table').innerHTML = h;
  const ms = sel.month.size ? [...sel.month].sort((a,b)=>a-b).map(i=>monthLabel(D.months[i])).join(', ') : '전체 기간';
  document.getElementById('tbl-note').textContent = '단위: 원 · ' + ms;
}

function render(){
  if(!D) return;
  syncChips(); drawKpis(); drawMonthly(); drawBars('product'); drawBars('channel'); drawTable();
  document.getElementById('foot').textContent =
    `데이터 ${D.rows.length}행 · ${D.months[0]} ~ ${D.months[D.months.length-1]} · 매출 = 판매수량 × 정가 × (1 − 할인율)`;
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 120); });
load();
</script>
